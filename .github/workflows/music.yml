name: AnnieX Music Bot

on:
  workflow_dispatch:
  push:
    branches:
      - Master

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start AnnieX Music Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          LOGGER_ID: ${{ secrets.LOGGER_ID }}
          MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
          COOKIE_URL: ${{ secrets.COOKIE_URL }}

          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
          STRING_SESSION3: ${{ secrets.STRING_SESSION3 }}
          STRING_SESSION4: ${{ secrets.STRING_SESSION4 }}
          STRING_SESSION5: ${{ secrets.STRING_SESSION5 }}

          API_URL: ${{ secrets.API_URL }}
          VIDEO_API_URL: ${{ secrets.VIDEO_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DEEP_API: ${{ secrets.DEEP_API }}

          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_NAME: ${{ secrets.BOT_NAME }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
          ASSUSERNAME: ${{ secrets.ASSUSERNAME }}

          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

        run: |
          python3 -m AnnieXMedia