name: AnnieXMusic

on:
  workflow_dispatch:
  push:
    branches:
      - Master

permissions:
  contents: read

concurrency:
  group: anniexmusic-production
  cancel-in-progress: true

jobs:
  run-music-bot:
    name: Run AnnieXMusic
    runs-on: ubuntu-latest
    environment:
      name: Production
    timeout-minutes: 350

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      LOGGER_ID: ${{ secrets.LOGGER_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      STRING_SESSION: ${{ secrets.STRING_SESSION }}
      STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
      STRING_SESSION3: ${{ secrets.STRING_SESSION3 }}
      STRING_SESSION4: ${{ secrets.STRING_SESSION4 }}
      STRING_SESSION5: ${{ secrets.STRING_SESSION5 }}
      MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
      COOKIE_URL: ${{ secrets.COOKIE_URL }}
      DEEP_API: ${{ secrets.DEEP_API }}
      API_URL: ${{ secrets.API_URL }}
      VIDEO_API_URL: ${{ secrets.VIDEO_API_URL }}
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          ffmpeg -version

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          for name in API_ID API_HASH OWNER_ID LOGGER_ID BOT_TOKEN STRING_SESSION MONGO_DB_URI; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing Production environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start AnnieXMusic
        run: python -m AnnieXMedia
